<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>바로테이블 · 점주 대시보드</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
  <link rel="stylesheet" href="../../static/css/app.css?v=20261025a" th:href="@{/css/app.css}">
</head>
<!-- O-02 점주 대시보드 (예약 현황 · 노쇼 · 워크인 재배정) -->
<body data-depth="1" data-screen="owner-dashboard" th:data-server="true">
<div class="owner-shell">
<aside aria-label="점주 메뉴" class="side" id="owner-side"></aside>
<main class="owner-main">
<div class="page-title">
<div>
<h1>오늘 예약 현황</h1>
<p><span id="today-label">2026.10.05 (월)</span> · 예약 · 좌석 · 도착 현황을 빠르게 확인하세요.</p>
</div>
<div class="row">
<span class="badge badge-gray" style="font-size:13px;padding:6px 12px">기준 시간 19:00</span>
<button class="btn btn-ghost btn-sm" id="demo-reset" title="취소·노쇼·워크인 등 바꾼 내용을 처음 데이터로 되돌립니다" type="button">시연 데이터 초기화</button>
</div>
</div>
<section aria-label="예약 요약" class="stats" id="stats"></section>


<div class="owner-overview-grid"><section aria-labelledby="tt-title" class="card owner-timeline-card" id="owner-timetable" style="margin-top:18px">
<div class="card-head">
<div><h2 id="tt-title">오늘 예약 시간표</h2><p class="card-sub">시간대와 테이블을 선택해 필요한 예약만 확인하세요.</p></div>
<span aria-live="polite" class="soon-status" id="soon-status"></span>
</div>
<div aria-label="시간표 보기 옵션" class="owner-tt-toolbar">
<div aria-label="시간대 선택" class="owner-tt-period" id="tt-period" role="group">
<button aria-pressed="true" class="active" data-period="around" type="button">지금 주변</button>
<button aria-pressed="false" data-period="lunch" type="button">점심</button>
<button aria-pressed="false" data-period="dinner" type="button">저녁</button>
<button aria-pressed="false" data-period="full" type="button">전체 시간</button>
</div>
<div class="owner-tt-control">
<label class="sr-only" for="tt-floor">시간표 층 선택</label>
<select aria-label="표시할 층" class="owner-tt-select" id="tt-floor"></select>
<span aria-live="polite" class="owner-tt-range" id="tt-range-label"></span>
</div>
</div>
<div aria-label="예약 시간표, 세로 및 가로 스크롤 가능" class="tt-scroll tt-dashboard-scroll" id="timetable" tabindex="0"></div><div aria-label="시간표 테이블 페이지 이동" class="owner-tt-pages"><span aria-live="polite" id="tt-page-summary"></span><div class="owner-pager-buttons"><button aria-label="이전 테이블" class="owner-mini-button" id="tt-prev" type="button">←</button><button aria-label="다음 테이블" class="owner-mini-button" id="tt-next" type="button">→</button></div></div>
<div class="tt-legend"><span><i class="l-res"></i>예약</span><span><i class="l-seat"></i>이용 중</span><span><i class="l-walk"></i>워크인 · 전화</span><span><i class="l-soon"></i>30분 이내 도착</span><span><i class="l-brk"></i>브레이크 (예약 불가)</span></div>
</section><section aria-label="현재 좌석도" class="card" id="owner-seats">
<div class="card-head">
<div class="row"><h2>현재 좌석도</h2><div class="tabs" id="floor-tabs" role="tablist"></div></div>

<div class="owner-seat-header-actions"><div class="legend"><span><i class="l-booked"></i>확정</span><span><i class="l-visited"></i>방문 완료</span><span><i class="l-waiting"></i>곧 도착</span><span><i class="l-empty"></i>빈자리</span></div><button aria-expanded="false" class="owner-text-button" id="seat-toggle" type="button">크게 보기 ↗</button></div></div>
<div class="map-scroll"><div id="map"></div></div>
</section></div><div class="owner-bottom-grid"><section aria-label="예약 목록" class="card" id="owner-reservations">
<div class="card-head owner-compact-header">
<h2>예약 목록</h2>
<div aria-label="예약 상태 필터" class="tabs" id="list-tabs" role="tablist"></div>
<button aria-expanded="false" class="owner-text-button" id="res-show-all" type="button">전체 보기</button></div>
<div class="list-scroll">
<table class="list">
<thead><tr><th>시간</th><th>예약자</th><th>인원</th><th>테이블</th><th>상태</th><th>요청사항</th></tr></thead>
<tbody id="res-rows"></tbody>
</table>
</div><p aria-live="polite" class="owner-list-summary" id="res-list-summary"></p>
</section><div class="stack owner-mini-actions" style="gap:14px;min-width:0"><section aria-label="선택한 예약" class="card stack" id="detail"></section><section aria-labelledby="wk-title" class="card stack" id="walkin">
<div>
<h2 id="wk-title">워크인 손님</h2>
<p class="card-sub">인원만 입력하면 지금 앉을 수 있는 자리를 추천합니다. 확정된 다른 예약 자리는 바꾸지 않습니다.</p>
</div>
<div class="row">
<div aria-label="워크인 인원" class="stepper"><button aria-label="인원 줄이기" id="wk-minus" type="button">−</button><output id="wk-val">2명</output><button aria-label="인원 늘리기" id="wk-plus" type="button">+</button></div>
<button class="btn btn-primary btn-sm" id="wk-find" type="button">빈자리 찾기</button>
</div>
<div aria-live="polite" class="stack" id="wk-list" style="gap:8px"></div>
<a class="hint" data-go="owner-guests" href="../owner/guests.html" th:href="@{/owner/guests}">전화 예약 손님 배정, 테이블별 시간표는 손님 배정 화면에서 →</a>
</section></div></div></main>
</div>

  <script src="../../static/js/data.js?v=20261025a" th:src="@{/js/data.js}"></script>
  <script src="../../static/js/common.js?v=20261025a" th:src="@{/js/common.js}"></script>
  <script src="../../static/js/seatmap.js?v=20261025a" th:src="@{/js/seatmap.js}"></script>
  <script src="../../static/js/timetable.js?v=20261025a" th:src="@{/js/timetable.js}"></script>
  <script src="../../static/js/owner-common.js?v=20261025a" th:src="@{/js/owner-common.js}"></script>
  <script src="../../static/js/pages/dashboard.js?v=20261025a" th:src="@{/js/pages/dashboard.js}"></script>
</body>
</html>
