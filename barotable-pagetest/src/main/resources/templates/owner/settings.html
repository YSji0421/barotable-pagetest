<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>바로테이블 · 운영 조건</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
  <link rel="stylesheet" href="../../static/css/app.css?v=20261110a" th:href="@{/css/app.css}">
  <link rel="stylesheet" href="../../static/css/responsive.css?v=20261110a" th:href="@{/css/responsive.css}">
  <link rel="stylesheet" href="../../static/css/ui.css?v=20261110a" th:href="@{/css/ui.css}">
  <link rel="stylesheet" href="../../static/css/owner.css?v=20261110a" th:href="@{/css/owner.css}">
</head>
<!-- O-04 운영 조건 -->
<body data-depth="1" data-screen="owner-settings" th:data-server="true">
<div class="owner-shell">
<aside aria-label="점주 메뉴" class="side" id="owner-side"></aside>
<main class="owner-main">
<div>
<div class="page-title">
<div>
<h1>운영 조건</h1>
<p>영업시간과 인원, 이용 시간, 예약 한도를 정합니다.</p>
</div>
</div>
<div class="grid cols-2">
<section aria-labelledby="s1" class="card stack">
<h2 id="s1">영업시간</h2>
<div class="form-row">
<div class="field"><label for="s-open">오픈</label><input class="input" id="s-open" step="1800" type="time" value="11:30"/></div>
<div class="field"><label for="s-close">마감</label><input class="input" id="s-close" step="1800" type="time" value="22:00"/></div>
</div>
<div class="form-row">
<div class="field"><label for="s-bs">브레이크 시작</label><input class="input" id="s-bs" step="1800" type="time" value="15:00"/></div>
<div class="field"><label for="s-be">브레이크 끝</label><input class="input" id="s-be" step="1800" type="time" value="17:00"/></div>
</div>
<p aria-live="polite" class="notice" id="s-preview">손님 화면 예약 시간: 11:30 ~ 21:30 · 브레이크 15:00–17:00 제외</p>
</section>
<section aria-labelledby="s2" class="card stack">
<h2 id="s2">인원 · 이용 시간</h2>
<div class="form-row">
<div class="field"><label for="s-min">최소 인원</label><input class="input" id="s-min" max="30" min="1" type="number" value="1"/></div>
<div class="field"><label for="s-max">최대 인원</label><input class="input" id="s-max" max="30" min="1" type="number" value="8"/></div>
</div>
<div class="form-row">
<div class="field"><label for="s-dine">이용 시간 (분)</label><select class="select" id="s-dine"><option>60</option><option selected="">90</option><option>120</option><option>150</option></select></div>
<div class="field"><label for="s-limit">시간대별 예약 한도 (팀)</label><input class="input" id="s-limit" max="50" min="1" type="number" value="8"/></div>
</div>
<div class="field"><label for="s-noshow">노쇼 경고 기준 (회)</label><input class="input" id="s-noshow" max="10" min="1" type="number" value="2"/><span class="hint">이 횟수 이상 노쇼한 연락처는 예약 목록에 경고가 표시됩니다.</span></div>
</section>
<section aria-labelledby="s3" class="card stack">
<h2 id="s3">예약 방식 · 알림</h2>
<label class="switch"><input checked="" id="s-choice" type="checkbox"/><span class="track"></span>손님이 좌석도에서 자리를 직접 고르게 허용</label>
<p class="hint" style="margin-top:-6px">끄면 손님 화면에서 자동 배정만 사용합니다.</p>
<label class="switch"><input checked="" id="s-n1" type="checkbox"/><span class="track"></span>예약 확정 시 확인 이메일 보내기</label>
<label class="switch"><input checked="" id="s-n2" type="checkbox"/><span class="track"></span>방문 전날 알림 이메일 보내기</label>
</section>
</div>
<section aria-label="저장" class="card" style="margin-top:16px">
<div class="row ed-savebar" style="margin-top:0;padding-top:0;border-top:0">
<span aria-live="polite" class="hint" id="save-state">저장된 설정</span>
<span class="grow"></span>
<button class="btn btn-ghost btn-sm" id="s-reset" type="button">기본값으로</button>
<button class="btn btn-primary btn-sm" id="s-save" type="button">운영 조건 저장</button>
</div>
<ul class="result-list" hidden="" id="s-result" style="margin-top:10px"></ul>
</section>
</div>
</main>
</div>

  <script src="../../static/js/data.js?v=20261110a" th:src="@{/js/data.js}"></script>
  <script src="../../static/js/common.js?v=20261110a" th:src="@{/js/common.js}"></script>
  <script src="../../static/js/owner-common.js?v=20261110a" th:src="@{/js/owner-common.js}"></script>
  <script src="../../static/js/pages/settings.js?v=20261110a" th:src="@{/js/pages/settings.js}"></script>
  <script src="../../static/js/drag-scroll.js?v=20261110a" th:src="@{/js/drag-scroll.js}"></script>
</body>
</html>
