<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>바로테이블 · 좌석도 편집</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
  <link rel="stylesheet" href="../../static/css/app.css?v=20261110a" th:href="@{/css/app.css}">
  <link rel="stylesheet" href="../../static/css/responsive.css?v=20261110a" th:href="@{/css/responsive.css}">
  <link rel="stylesheet" href="../../static/css/wide.css?v=20261110a" th:href="@{/css/wide.css}">
  <link rel="stylesheet" href="../../static/css/ui.css?v=20261110a" th:href="@{/css/ui.css}">
  <link rel="stylesheet" href="../../static/css/owner.css?v=20261110a" th:href="@{/css/owner.css}">
</head>
<!-- O-03 점주용 좌석도 편집 (층별 구역 나누기) -->
<body data-depth="1" data-screen="owner-editor" th:data-server="true">
<div class="owner-shell">
<aside aria-label="점주 메뉴" class="side" id="owner-side"></aside>
<main class="owner-main">
<div class="page-title">
<div>
<h1>좌석도 편집</h1>
<p>매장 배치에 맞춰 테이블·의자·구역을 배치하세요. 저장하면 고객 예약 화면에도 동일하게 반영됩니다.</p>
</div>
</div>
<section aria-label="층 관리" class="card" style="padding:14px 18px;margin-bottom:16px">
<div class="row" style="justify-content:space-between">
<div class="row">
<div aria-label="층" class="tabs" id="floor-tabs" role="tablist"></div>
<button class="btn btn-soft btn-sm" id="add-floor" type="button">+ 층 추가</button>
</div>
<div class="row">
<label class="field-label" for="floor-name">층 이름</label>
<input class="input" id="floor-name" style="min-height:36px;width:120px;padding:6px 10px"/>
<button class="btn btn-danger btn-sm" id="del-floor" type="button">이 층 삭제</button>
</div>
</div>
</section>
<div class="editor">
<nav aria-label="오브젝트" class="palette">
<h3>구역</h3>
<button id="add-zone" type="button">구역 추가 <span>점선 영역</span></button>
<h3 style="margin-top:8px">테이블</h3>
<button data-add="table" data-preset="round2" draggable="true" type="button">2인 테이블 <span>원형</span></button>
<button data-add="table" data-preset="rect4" draggable="true" type="button">4인 테이블 <span>사각</span></button>
<button data-add="table" data-preset="rect6" draggable="true" type="button">6인 테이블 <span>사각</span></button>
<button data-add="table" data-preset="bar2" draggable="true" type="button">바 테이블 <span>2인</span></button>
<button data-add="table" data-preset="room8" draggable="true" type="button">룸 <span>8인</span></button>
<h3 style="margin-top:8px">시설</h3>
<button data-add="fixture" data-preset="window" draggable="true" type="button">창문</button>
<button data-add="fixture" data-preset="wall" draggable="true" type="button">벽</button>
<button data-add="fixture" data-preset="entrance" draggable="true" type="button">입구</button>
<button data-add="fixture" data-preset="kitchen" draggable="true" type="button">주방</button>
<button data-add="fixture" data-preset="restroom" draggable="true" type="button">화장실</button>
<button data-add="fixture" data-preset="stairs" draggable="true" type="button">계단</button>
<p class="palette-hint">눌러서 가운데에 놓거나, 캔버스로 끌어다 놓습니다.</p>
</nav>
<section aria-label="매장 캔버스" class="card ed-canvas" style="padding:16px">
<div class="card-head" style="margin-bottom:10px">
<div><h2 id="canvas-title" style="font-size:16px">1층 캔버스</h2><p class="card-sub">테이블을 선택해 끌어서 옮기세요. 오른쪽 패널에서 좌석 수·모양·특징을 바꾸면 고객 화면 미리보기도 함께 바뀝니다.</p></div>
<div aria-label="확대/축소" class="row" role="group">
<button aria-label="축소" class="btn btn-ghost btn-sm" id="zoom-out" type="button">−</button>
<output class="mono" id="zoom-val" style="min-width:48px;text-align:center">100%</output>
<button aria-label="확대" class="btn btn-ghost btn-sm" id="zoom-in" type="button">+</button>
<button class="btn btn-ghost btn-sm" id="zoom-fit" type="button">맞춤</button>
</div>
</div>
<div class="zone-filter" id="zone-chips" style="margin-bottom:12px"></div>
<div class="map-scroll ed-scroll" id="canvas-scroll"><div id="canvas"></div></div>
<p class="hint" style="margin-top:8px">Ctrl + 휠로 확대/축소, 방향키로 10단위 이동, Delete로 삭제합니다.</p>
<div class="row ed-savebar">
<span aria-live="polite" class="hint" id="save-state">저장된 배치</span>
<span class="grow"></span>
<a class="btn btn-ghost btn-sm editor-preview-link" data-go="index" href="../index.html" th:href="@{/}" aria-label="고객 화면 미리보기">고객 화면 미리보기</a><button class="btn btn-ghost btn-sm" id="layout-reset" type="button">처음 배치로</button>
<button class="btn btn-primary btn-sm" id="layout-save" type="button">좌석도 저장</button>
</div>
<ul class="result-list" hidden="" id="save-result"></ul>
</section>
<aside aria-label="속성" aria-live="polite" class="card props stack" id="props"></aside>
</div>
</main>
</div>

  <script src="../../static/js/data.js?v=20261110a" th:src="@{/js/data.js}"></script>
  <script src="../../static/js/common.js?v=20261110a" th:src="@{/js/common.js}"></script>
  <script src="../../static/js/owner-common.js?v=20261110a" th:src="@{/js/owner-common.js}"></script>
  <script src="../../static/js/pages/editor.js?v=20261110a" th:src="@{/js/pages/editor.js}"></script>
  <script src="../../static/js/drag-scroll.js?v=20261110a" th:src="@{/js/drag-scroll.js}"></script>
</body>
</html>
