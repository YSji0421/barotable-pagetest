<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>바로테이블 · 점주 로그인</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
  <link rel="stylesheet" href="../../static/css/app.css?v=20261110a" th:href="@{/css/app.css}">
  <link rel="stylesheet" href="../../static/css/responsive.css?v=20261110a" th:href="@{/css/responsive.css}">
  <link rel="stylesheet" href="../../static/css/ui.css?v=20261110a" th:href="@{/css/ui.css}">
</head>
<!-- A-01 점주·관리자 로그인 (Spring Security formLogin 으로 연결 예정) -->
<body data-depth="1" data-screen="owner-login" th:data-server="true">
<header class="site-head">
<div class="wrap">
<a class="brand" data-go="index" href="../index.html" th:href="@{/}">바로테이블</a>
<span class="head-sub">매장 관리</span>
<span class="head-spacer"></span>
<a class="head-link" data-go="index" href="../index.html" style="color:var(--teal-deep)" th:href="@{/}">손님 예약 화면</a>
</div>
</header>
<main class="page wrap">
<div class="grid cols-2" style="align-items:stretch">
<section aria-labelledby="ow-title" class="card card-dark stack" style="justify-content:space-between">
<div class="stack" style="gap:10px">
<h1 id="ow-title" style="font-size:22px">매장 관리</h1>
<p class="muted">점주는 자기 매장의 예약 현황과 층별 테이블·좌석도·운영 조건을 관리합니다.</p>
</div>
<div class="stack" style="gap:8px">
<span class="badge badge-solid" style="align-self:flex-start">관리자 승인 후 사용</span>
<p class="muted" style="font-size:13px">매장 관리자 계정으로 로그인하세요.</p>
</div>
</section>
<section aria-labelledby="lg-title" class="card stack">
<h2 id="lg-title">로그인</h2>
<div aria-label="계정 종류" class="tabs" id="role-tabs" role="tablist" style="align-self:flex-start">
<button aria-selected="true" class="tab on" data-role="owner" role="tab" type="button">점주</button>
<button aria-selected="false" class="tab" data-role="admin" role="tab" type="button">서비스 관리자</button>
</div>
<div class="field">
<label for="lg-email">계정 이메일</label>
<input autocomplete="username" class="input" id="lg-email" name="username" placeholder="이메일 주소" type="email"/>
</div>
<div class="field">
<label for="lg-pw">비밀번호</label>
<input autocomplete="current-password" class="input" id="lg-pw" name="password" placeholder="비밀번호" type="password"/>
</div>
<a class="btn btn-indigo" data-go="owner-dashboard" href="../owner/dashboard.html" id="lg-go" th:href="@{/owner/dashboard}">로그인</a>
<p class="hint" id="lg-hint">점주 계정은 서비스 관리자가 승인한 뒤 쓸 수 있어요.</p>
</section>
</div>
</main>

  <script src="../../static/js/data.js?v=20261110a" th:src="@{/js/data.js}"></script>
  <script src="../../static/js/common.js?v=20261110a" th:src="@{/js/common.js}"></script>
  <script>
    /* 화면 확인용: 역할에 따라 이동할 화면만 바꾼다 (실제 구현은 Spring Security 역할 OWNER / ADMIN) */
    (function () {
      const ROLE = { owner: ['owner@example.com', 'owner-dashboard', '점주 계정은 서비스 관리자가 승인한 뒤 쓸 수 있어요.'], admin: ['admin@example.com', 'admin', '관리자는 점주 계정 승인과 서비스 상태를 봅니다.'] };
      document.querySelectorAll('#role-tabs .tab').forEach(b => b.addEventListener('click', () => {
        const r = ROLE[b.dataset.role];
        document.querySelectorAll('#role-tabs .tab').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-selected', x === b); });
        document.getElementById('lg-email').value = r[0];
        const go = document.getElementById('lg-go'); go.dataset.go = r[1]; go.href = BT.url(r[1]);
        document.getElementById('lg-hint').textContent = r[2];
      }));
    })();
  
  </script>
  <script src="../../static/js/drag-scroll.js?v=20261110a" th:src="@{/js/drag-scroll.js}"></script>
</body>
</html>
